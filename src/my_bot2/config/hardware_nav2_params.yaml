# =====================================================================
# Nav2 parameters for the Ackermann cart
#   Footprint: 1.25 m long x 0.65 m wide, base_link at geometric center
#   Wheelbase: 0.65 m,  Max steering: 30 deg  ->  R_min ~= 1.13 m
#   Controller : RegulatedPurePursuit (Ackermann friendly)
#   Planner    : SmacHybrid-A* (kinematically feasible paths)
# =====================================================================

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # Cart IS Ackermann, but AMCL's motion model only affects particle spread.
    # Differential model works fine here since rf2o supplies odometry.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # EXACT INITIAL POSE
    set_initial_pose: true
    initial_pose:
       x: -2.84164
       y: -6.47463
       z: 0.0
       yaw: 0.0368873
       
       
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    
    # ADDED THE MISSING QUOTATION MARK AT THE END OF THIS LINE VVV
    default_nav_to_pose_bt_xml: "/home/abdullah/ros2_ws/src/my_bot2/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/home/abdullah/ros2_ws/src/my_bot2/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

# =====================================================================
# CONTROLLER  - Regulated Pure Pursuit
#   Respects min turning radius, no in-place rotations.
# =====================================================================
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.50   # loose - Ackermann cant snap to exact yaw

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8         # nominal driving speed [m/s]
      lookahead_dist: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.0   # CAR CANNOT ROTATE IN PLACE
      transform_tolerance: 0.2
      use_rotate_to_heading: false         # DISABLED for Ackermann
      allow_reversing: false
      min_approach_linear_velocity: 0.25
      approach_velocity_scaling_dist: 1.0
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.2    # matches our R_min
      regulated_linear_scaling_min_speed: 0.25
      # Hard kinematic guard: the controller will NEVER output a turn tighter
      # than this. 1.13 m is our geometric minimum - leaving a little margin.
      use_collision_detection: true
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0

# =====================================================================
# LOCAL COSTMAP
#   Footprint (not radius!) - honest 1.25 x 0.65 rectangle.
# =====================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # Rectangle around base_link (cart center).
      # Points: FR, FL, RL, RR (x forward, y left).
      footprint: "[[0.625, -0.325], [0.625, 0.325], [-0.625, 0.325], [-0.625, -0.325]]"
      footprint_padding: 0.05
      transform_tolerance: 0.5
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.12
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.0

# =====================================================================
# GLOBAL COSTMAP
# =====================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.5
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.625, -0.325], [0.625, 0.325], [-0.625, 0.325], [-0.625, -0.325]]"
      footprint_padding: 0.05
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5

# =====================================================================
# PLANNER  - Smac Hybrid-A*
#   Plans kinematically feasible paths for a car with a given min radius.
# =====================================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"  # Cart does NOT reverse while planning
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 1.2       # >= our physical R_min of 1.13 m
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false

behavior_server:
  ros__parameters:
    cycle_frequency: 15.0
    behavior_plugins: ["backup", "drive_on_heading", "wait", "spin"]
    
    backup:
      plugin: "nav2_behaviors::BackUp"       # Notice the :: instead of /
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    spin:
      plugin: "nav2_behaviors::Spin"         # Must be ::Spin
    
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0

# =====================================================================
# VELOCITY SMOOTHER
#   Caps what ever leaks out of the controller.
# =====================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # x = forward m/s, y = strafe (ZERO), theta = yaw rate rad/s
    max_velocity: [1.5, 0.0, 1.4]
    min_velocity: [-0.7, 0.0, -1.4]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-2.0, 0.0, -2.0]
    velocity_timeout: 1.0

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "/home/abdullah/ros2_ws/src/my_mapper/maps/Lab_map.yaml"
